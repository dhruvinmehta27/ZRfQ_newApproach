_schema-version: "3.1"
ID: ZRfQ-newApproach
version: 1.0.0
description: CAP + Fiori Elements RFQ Management – SAP BTP CF eu10

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --production
        - npx cds build --production

modules:

  # ── CAP Node.js backend ─────────────────────────────────────────────────────
  - name: ZRfQ-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
      ignore:
        - .env
        - node_modules/
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cx-xsuaa-mcp
      - name: cx-destination

  # ── Approuter ───────────────────────────────────────────────────────────────
  - name: ZRfQ-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: cx-xsuaa-mcp
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:

  # ── XSUAA  (plan: application – NOT apiaccess) ──────────────────────────────
  - name: cx-xsuaa-mcp
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ── BTP Destination Service ──────────────────────────────────────────────────
  - name: cx-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
